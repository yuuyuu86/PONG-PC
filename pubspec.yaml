name: pong_pc
description: "PONG! — 同じ部屋のPC 2台で遊ぶ、白黒落書き風の1対1スポーツゲーム集（Mac / Windows）"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  audioplayers: ^6.7.1
  basic_utils: ^5.8.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
  fonts:
    - family: Yomogi
      fonts:
        - asset: assets/fonts/Yomogi-Regular.ttf
